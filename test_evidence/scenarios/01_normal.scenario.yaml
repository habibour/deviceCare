name: 01 Normal operation (230V, 5A)
version: 1
steps:
  - wait-serial: "Voltage Protector"
  - set-control: {part-id: pot1, control: position, value: 0.70}
  - set-control: {part-id: pot2, control: position, value: 0.25}
  - wait-serial: "STATE:MONITORING FAULT:NONE"
  - expect-pin: {part-id: led_relay, pin: A, value: 1}
